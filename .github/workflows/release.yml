name: release
on:
    release:
        types: [published]

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2

            - uses: actions/setup-node@v2
              with:
                  registry-url: 'https://npm.pkg.github.com'
                  node-version: 16

            - uses: bahmutov/npm-install@v1

            # Publish to GitHub Packages
            - run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
